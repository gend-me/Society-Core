name: version-check

# GS_VERSION (gend-society.php) is the single version source. This job fails
# when the plugin header, readme Stable tag, bundled theme Version or theme
# readme Stable tag disagree with it, when a hard-coded asset cache-buster
# appears in shipped PHP/JS, or when any shipped PHP file has a parse error.

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  version-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Single version + cache-buster check
        run: bash bin/stamp-version.sh check

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
          tools: none

      - name: php -l (all shipped PHP, excluding handoff/)
        run: |
          set -euo pipefail
          fail=0
          while IFS= read -r -d '' f; do
            if ! out=$(php -l "$f" 2>&1); then
              echo "$out"; fail=1
            fi
          done < <(find . \( -path ./.git -o -path ./handoff \) -prune -o -type f -name '*.php' -print0)
          exit "$fail"
